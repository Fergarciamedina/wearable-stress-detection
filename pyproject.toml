[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-stress"
version = "1.0.0"
description = "Wearable physiological stress detection and exercise false alarm evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Open-Source Research Team"}
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.28",
    "joblib>=1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
