services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: wearable-stress-dashboard:1.0.0
    container_name: wearable_stress_dashboard
    ports:
      - "8501:8501"
    environment:
      - WEARABLE_DATA_DIR=/app/data
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      # Mount data directory containing raw datasets, splits, and checkpoints.
      # Defaults to ../data in the project workspace, or configure via: DATA_DIR=/path/to/data
      - ${DATA_DIR:-../data}:/app/data
    restart: unless-stopped
